services:
  # ---------------------------------------------------------------------------
  # TELOS-S BACKEND — FastAPI + Genomic Analysis Pipeline
  # ---------------------------------------------------------------------------
  telos-backend:
    build:
      context: ../backend # Root directory of the backend repository, check for the correct name
      dockerfile: Dockerfile # Dockerfile in the root of the backend repository
    container_name: telos-backend
    restart: unless-stopped
    ports:
      - "6002:8000"
    volumes:
      # Shared output with the MCP server (analysis, reports, CSV files)
      - telos_output:/app/output
      # ESM-2 model cache (2.5 GB) – persists across restarts
      - huggingface_cache:/root/.cache/huggingface
      # Wuhan Reference: Automatically downloaded on the first startup
      # and persisted to avoid re-downloading it
      - telos_reference:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - HF_HOME=/root/.cache/huggingface
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:6002} # ← Host port, not the container port
      - ESM_2_SIZE=facebook/esm2_t33_650M_UR50D
    networks:
      - telos-net

  # ===========================================================================
  # CORE: TELOS-S FRONTEND - Svelte 5 + Vite compiled, served by Nginx
  # ===========================================================================
  telos-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Backend URL – This should be accessible from the user's BROWSER,
        # not from within Docker. Use localhost if it's a local demo.
        VITE_API_URL: ${VITE_API_URL:-http://0.0.0.0:6002}
        # Mapbox token for Telos-SIM (leave blank if not using the map)
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-pk.eyJ1Ijoia3VyYWkwMjEiLCJhIjoiY2ptbTRnMWsxMDBkeTN2cXhlaWM2aXJ0OSJ9.KI3udYVSC-oXgNueokCw0g}
    container_name: telos-frontend
    restart: unless-stopped
    ports:
      - "6001:80"
    networks:
      - telos-net
    depends_on:
      - telos-backend

  # ---------------------------------------------------------------------------
  # TELOS-S MCP SERVER — Exposes analysis results to Ollama
  # ---------------------------------------------------------------------------
  telos-mcp:
    build:
      context: ./ # # Local folder next to the Docker Compose file
      dockerfile: Dockerfile
    container_name: telos-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - telos_output:/app/output:ro # Read-only
    environment:
      - PYTHONUNBUFFERED=1
      - TELOS_API_URL=http://telos-backend:6002
      - MCP_PORT=8001
    networks:
      - telos-net
    depends_on:
      - telos-backend

# =============================================================================
# Volumes
# =============================================================================
volumes:
  telos_output:
    name: telos_s_output
  telos_reference:
    name: telos_s_reference # Wuhan Spike automatically downloaded
  huggingface_cache:
    name: telos_s_hf_cache
  ollama_models:
    name: telos_s_ollama_models

# =============================================================================
# Internal network
# =============================================================================
networks:
  telos-net:
    name: telos-network
    driver: bridge
